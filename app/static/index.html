<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>JARVIS Assistant</title><link rel="stylesheet" href="/static/styles.css"><script src="/static/app.js" defer></script></head><body><div class="app-shell"><aside class="sidebar"><div class="brand-row"><div><p class="eyebrow">LOCAL ASSISTANT</p><h1>JARVIS</h1></div></div><button id="new-conversation" class="primary-action">New conversation</button><p id="conversation-status">Loading conversations…</p><nav id="conversation-list"></nav></aside><main class="chat-panel"><header class="chat-header"><div><p class="eyebrow">CURRENT CONVERSATION</p><h2 id="conversation-title">New conversation</h2></div><button id="delete-conversation" hidden>Delete</button></header><div class="mode-switch" role="tablist"><button id="chat-mode" role="tab" aria-selected="true">Chat</button><button id="voice-mode" role="tab" aria-selected="false">Voice</button></div><section id="messages" class="messages" aria-live="polite"><div id="empty-state" class="empty-state"><div class="orb"></div><h3>How can I help?</h3><p>Start a conversation with JARVIS.</p></div></section><div id="error-banner" role="alert" hidden></div><form id="composer" class="composer"><textarea id="message-input" maxlength="32000" placeholder="Message JARVIS" required></textarea><button id="send-message">Send</button></form><section id="voice-controls" hidden><button id="push-to-talk" type="button" aria-describedby="voice-status">Hold to talk</button><p id="voice-status" role="status">Press and hold, then release to send.</p></section><p id="composer-note">Enter to send · Shift+Enter for a new line</p></main></div></body></html>
