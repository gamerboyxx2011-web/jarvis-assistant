<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>JARVIS Assistant</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Conversation history">
      <div class="brand-row"><div><p class="eyebrow">LOCAL ASSISTANT</p><h1>JARVIS</h1></div><span class="status-dot" title="Local interface" aria-label="Local interface active"></span></div>
      <button id="new-conversation" class="primary-action" type="button">New conversation</button>
      <p id="conversation-status" class="sidebar-status" role="status">Loading conversations…</p>
      <nav id="conversation-list" class="conversation-list" aria-label="Conversations"></nav>
    </aside>
    <main class="chat-panel">
      <header class="chat-header"><div><p class="eyebrow">CURRENT CONVERSATION</p><h2 id="conversation-title">New conversation</h2></div><button id="delete-conversation" class="danger-action" type="button" hidden>Delete</button></header>
      <section id="messages" class="messages" aria-live="polite" aria-label="Messages"><div id="empty-state" class="empty-state"><div class="orb" aria-hidden="true"></div><h3>How can I help?</h3><p>Start a conversation with your local JARVIS assistant.</p></div></section>
      <div id="error-banner" class="error-banner" role="alert" hidden></div>
      <form id="composer" class="composer"><label class="sr-only" for="message-input">Message JARVIS</label><textarea id="message-input" name="message" rows="1" maxlength="32000" placeholder="Message JARVIS" required></textarea><button id="send-message" type="submit" aria-label="Send message">Send</button></form>
      <p class="composer-note">Enter to send · Shift+Enter for a new line</p>
    </main>
  </div>
</body>
</html>
